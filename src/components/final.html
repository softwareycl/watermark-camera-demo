<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自定义水印相机</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: #333;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 100%;
      margin: 0 auto;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      text-align: center;
      margin: 15px 0 25px;
      font-size: 1.8rem;
      color: #2575fc;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }
    .controls-panel {
      background-color: #f9f9f9;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .control-group {
      margin-bottom: 15px;
    }
    .control-group h3 {
      margin-bottom: 10px;
      color: #2575fc;
      font-size: 1.1rem;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-container label {
      min-width: 80px;
    }
    input[type="range"] {
      flex: 1;
    }
    .value-display {
      min-width: 40px;
      text-align: center;
      font-weight: bold;
    }
    .color-picker {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .color-option {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .color-option.selected {
      border-color: #333;
      transform: scale(1.2);
    }
    .position-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .position-btn {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: white;
      cursor: pointer;
      text-align: center;
    }
    .position-btn.selected {
      background-color: #2575fc;
      color: white;
      border-color: #2575fc;
    }
    .toggle-switch {
      display: flex;
      gap: 15px;
    }
    .switch-btn {
      padding: 8px 15px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: white;
      cursor: pointer;
    }
    .switch-btn.selected {
      background-color: #2575fc;
      color: white;
      border-color: #2575fc;
    }
    .watermark-preview {
      height: 100px;
      background-color: #eee;
      border-radius: 10px;
      margin-top: 15px;
      position: relative;
      overflow: hidden;
    }
    .preview-text {
      position: absolute;
      color: rgba(0, 0, 0, 0.7);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>📷 自定义水印相机</h1>
      
      <div class="controls-panel">
        <div class="control-group">
          <h3>水印文字</h3>
          <input type="text" v-model="watermarkText" placeholder="输入水印文字" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
        </div>
        
        <div class="control-group">
          <h3>水印位置</h3>
          <div class="position-selector">
            <div 
              v-for="position in positionOptions" 
              :key="position.value"
              class="position-btn"
              :class="{ selected: watermarkPosition === position.value }"
              @click="watermarkPosition = position.value"
            >
              {{ position.label }}
            </div>
          </div>
        </div>
        
        <div class="control-group">
          <h3>水印倾斜度</h3>
          <div class="slider-container">
            <label>角度:</label>
            <input type="range" min="-45" max="45" v-model="watermarkRotation">
            <span class="value-display">{{ watermarkRotation }}°</span>
          </div>
        </div>
        
        <div class="control-group">
          <h3>水印颜色</h3>
          <div class="color-picker">
            <div 
              v-for="color in colorOptions" 
              :key="color"
              class="color-option"
              :style="{ backgroundColor: color }"
              :class="{ selected: watermarkColor === color }"
              @click="watermarkColor = color"
            ></div>
          </div>
        </div>
        
        <div class="control-group">
          <h3>水印透明度</h3>
          <div class="slider-container">
            <label>透明度:</label>
            <input type="range" min="0.1" max="1" step="0.1" v-model="watermarkOpacity">
            <span class="value-display">{{ Math.round(watermarkOpacity * 100) }}%</span>
          </div>
        </div>
        
        <div class="control-group">
          <h3>水印大小</h3>
          <div class="slider-container">
            <label>字体大小:</label>
            <input type="range" min="16" max="48" v-model="watermarkFontSize">
            <span class="value-display">{{ watermarkFontSize }}px</span>
          </div>
        </div>
        
        <div class="control-group">
          <h3>水印模式</h3>
          <div class="toggle-switch">
            <div 
              class="switch-btn"
              :class="{ selected: !isFullScreenWatermark }"
              @click="isFullScreenWatermark = false"
            >
              单个水印
            </div>
            <div 
              class="switch-btn"
              :class="{ selected: isFullScreenWatermark }"
              @click="isFullScreenWatermark = true"
            >
              全屏水印
            </div>
          </div>
        </div>
        
        <div class="control-group">
          <h3>水印预览</h3>
          <div class="watermark-preview">
            <div 
              class="preview-text"
              :style="previewStyle"
            >
              {{ watermarkText || '示例水印' }}
            </div>
          </div>
        </div>
      </div>
      
      <watermark-camera
        :watermark-text="watermarkText"
        :position="watermarkPosition"
        :rotation="watermarkRotation"
        :color="watermarkColor"
        :opacity="watermarkOpacity"
        :font-size="watermarkFontSize"
        :is-full-screen="isFullScreenWatermark"
        @capture="handleCapture"
      ></watermark-camera>
    </div>
  </div>

  <script>
    // 水印相机子组件
    Vue.component('watermark-camera', {
      template: `
        <div>
          <div v-if="!hasPermission" class="permission-msg">
            <p>需要相机权限才能使用此功能</p>
            <p>请允许浏览器访问您的相机</p>
            <button class="btn btn-save" @click="initCamera">授权相机访问</button>
          </div>
          
          <div v-else>
            <div v-if="!isCaptured" class="camera-container">
              <video id="videoElement" autoplay playsinline></video>
              <canvas id="watermarkCanvas" class="watermark-canvas"></canvas>
            </div>
            
            <div v-else class="preview-container">
              <img id="previewImage" :src="capturedImage" alt="拍摄的照片">
            </div>
            
            <div class="controls">
              <div v-if="!isCaptured" class="capture-btn" @click="captureImage">
                <div class="inner-circle"></div>
              </div>
              
              <div v-else class="action-buttons">
                <button class="btn btn-save" @click="saveImage">保存图片</button>
                <button class="btn btn-retake" @click="retake">重新拍照</button>
              </div>
              
              <div v-if="!isCaptured" class="camera-status">
                <span class="status-indicator" :class="{'status-active': isCameraActive, 'status-inactive': !isCameraActive}"></span>
                相机状态: {{ isCameraActive ? '使用中' : '已关闭' }}
              </div>
              
              <button v-if="!isCaptured && isCameraActive" class="close-camera-btn" @click="closeCamera">
                关闭相机
              </button>
            </div>
          </div>
        </div>
      `,
      props: {
        watermarkText: {
          type: String,
          default: '示例水印 ' + new Date().toLocaleDateString()
        },
        position: {
          type: String,
          default: 'bottom-center' // 可选: top-left, top-center, top-right, center, bottom-left, bottom-center, bottom-right
        },
        rotation: {
          type: Number,
          default: 0 // 水印旋转角度
        },
        color: {
          type: String,
          default: 'rgba(255, 255, 255, 0.7)'
        },
        opacity: {
          type: Number,
          default: 0.7
        },
        fontSize: {
          type: Number,
          default: 24
        },
        isFullScreen: {
          type: Boolean,
          default: false
        }
      },
      data() {
        return {
          hasPermission: false,
          isCaptured: false,
          isCameraActive: false,
          capturedImage: '',
          videoStream: null,
          watermarkInterval: null
        };
      },
      mounted() {
        this.initCamera();
        window.addEventListener('beforeunload', this.closeCamera);
      },
      methods: {
        async initCamera() {
          try {
            this.closeCamera();
            
            const stream = await navigator.mediaDevices.getUserMedia({ 
              video: { 
                facingMode: 'environment',
                width: { ideal: 1280 },
                height: { ideal: 720 }
              } 
            });
            
            this.videoStream = stream;
            const videoElement = document.getElementById('videoElement');
            videoElement.srcObject = stream;
            this.hasPermission = true;
            this.isCameraActive = true;
            
            videoElement.onloadedmetadata = () => {
              this.drawWatermark();
            };
          } catch (error) {
            console.error('无法访问相机:', error);
            this.hasPermission = false;
            this.isCameraActive = false;
          }
        },
        
        drawWatermark() {
          const video = document.getElementById('videoElement');
          const canvas = document.getElementById('watermarkCanvas');
          const ctx = canvas.getContext('2d');
          
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          
          if (this.watermarkInterval) {
            clearInterval(this.watermarkInterval);
          }
          
          this.watermarkInterval = setInterval(() => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              
              if (this.isFullScreen) {
                this.drawFullScreenWatermark(ctx, canvas.width, canvas.height);
              } else {
                this.drawSingleWatermark(ctx, canvas.width, canvas.height);
              }
            }
          }, 100);
        },
        
        drawSingleWatermark(ctx, width, height) {
          ctx.save();
          
          // 设置水印样式
          ctx.font = `bold ${this.fontSize}px Arial`;
          ctx.fillStyle = this.color.replace(/[\d\.]+\)$/g, this.opacity + ')');
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 4;
          
          // 计算水印位置
          let x, y;
          const padding = 30;
          
          switch (this.position) {
            case 'top-left':
              x = padding;
              y = padding;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'top';
              break;
            case 'top-center':
              x = width / 2;
              y = padding;
              ctx.textBaseline = 'top';
              break;
            case 'top-right':
              x = width - padding;
              y = padding;
              ctx.textAlign = 'right';
              ctx.textBaseline = 'top';
              break;
            case 'center':
              x = width / 2;
              y = height / 2;
              break;
            case 'bottom-left':
              x = padding;
              y = height - padding;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'bottom';
              break;
            case 'bottom-center':
              x = width / 2;
              y = height - padding;
              ctx.textBaseline = 'bottom';
              break;
            case 'bottom-right':
              x = width - padding;
              y = height - padding;
              ctx.textAlign = 'right';
              ctx.textBaseline = 'bottom';
              break;
            default:
              x = width / 2;
              y = height - padding;
              ctx.textBaseline = 'bottom';
          }
          
          // 应用旋转
          if (this.rotation !== 0) {
            ctx.translate(x, y);
            ctx.rotate(this.rotation * Math.PI / 180);
            ctx.fillText(this.watermarkText, 0, 0);
          } else {
            ctx.fillText(this.watermarkText, x, y);
          }
          
          ctx.restore();
        },
        
        drawFullScreenWatermark(ctx, width, height) {
          ctx.save();
          
          // 设置水印样式
          ctx.font = `bold ${this.fontSize}px Arial`;
          ctx.fillStyle = this.color.replace(/[\d\.]+\)$/g, this.opacity + ')');
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 2;
          
          // 计算平铺参数
          const textWidth = ctx.measureText(this.watermarkText).width;
          const spacing = textWidth * 2;
          const angle = this.rotation * Math.PI / 180;
          
          // 平铺水印
          for (let x = -width; x < width * 2; x += spacing) {
            for (let y = -height; y < height * 2; y += spacing) {
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(angle);
              ctx.fillText(this.watermarkText, 0, 0);
              ctx.restore();
            }
          }
          
          ctx.restore();
        },
        
        captureImage() {
          const video = document.getElementById('videoElement');
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          
          // 绘制当前视频帧
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          // 添加水印
          if (this.isFullScreen) {
            this.drawFullScreenWatermark(ctx, canvas.width, canvas.height);
          } else {
            this.drawSingleWatermark(ctx, canvas.width, canvas.height);
          }
          
          // 转换为DataURL
          this.capturedImage = canvas.toDataURL('image/jpeg', 0.9);
          this.isCaptured = true;
          
          // 通知父组件
          this.$emit('capture', this.capturedImage);
          
          // 停止视频流
          this.closeCamera();
        },
        
        saveImage() {
          const link = document.createElement('a');
          link.href = this.capturedImage;
          link.download = 'watermark-photo-' + new Date().getTime() + '.jpg';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        },
        
        retake() {
          this.isCaptured = false;
          this.capturedImage = '';
          this.initCamera();
        },
        
        closeCamera() {
          if (this.watermarkInterval) {
            clearInterval(this.watermarkInterval);
            this.watermarkInterval = null;
          }
          
          if (this.videoStream) {
            this.videoStream.getTracks().forEach(track => {
              track.stop();
            });
            this.videoStream = null;
          }
          
          this.isCameraActive = false;
        }
      },
      
      beforeDestroy() {
        this.closeCamera();
        window.removeEventListener('beforeunload', this.closeCamera);
      }
    });

    // 父组件
    new Vue({
      el: '#app',
      data: {
        watermarkText: '拍摄于 ' + new Date().toLocaleDateString(),
        watermarkPosition: 'bottom-center',
        watermarkRotation: 0,
        watermarkColor: 'rgba(255, 255, 255, 0.7)',
        watermarkOpacity: 0.7,
        watermarkFontSize: 24,
        isFullScreenWatermark: false,
        positionOptions: [
          { value: 'top-left', label: '左上' },
          { value: 'top-center', label: '上中' },
          { value: 'top-right', label: '右上' },
          { value: 'center', label: '中心' },
          { value: 'bottom-left', label: '左下' },
          { value: 'bottom-center', label: '下中' },
          { value: 'bottom-right', label: '右下' }
        ],
        colorOptions: [
          'rgba(255, 255, 255, 0.7)',
          'rgba(0, 0, 0, 0.7)',
          'rgba(255, 0, 0, 0.7)',
          'rgba(0, 255, 0, 0.7)',
          'rgba(0, 0, 255, 0.7)',
          'rgba(255, 255, 0, 0.7)',
          'rgba(255, 0, 255, 0.7)',
          'rgba(0, 255, 255, 0.7)'
        ]
      },
      computed: {
        previewStyle() {
          // 计算预览水印样式
          let style = {
            color: this.watermarkColor.replace(/[\d\.]+\)$/g, this.opacity + ')'),
            fontSize: this.watermarkFontSize + 'px',
            transform: `rotate(${this.watermarkRotation}deg)`,
            fontWeight: 'bold'
          };
          
          // 设置位置
          switch (this.watermarkPosition) {
            case 'top-left':
              Object.assign(style, { top: '10px', left: '10px', transformOrigin: '0 0' });
              break;
            case 'top-center':
              Object.assign(style, { top: '10px', left: '50%', transform: `translateX(-50%) rotate(${this.watermarkRotation}deg)` });
              break;
            case 'top-right':
              Object.assign(style, { top: '10px', right: '10px', transformOrigin: '100% 0' });
              break;
            case 'center':
              Object.assign(style, { top: '50%', left: '50%', transform: `translate(-50%, -50%) rotate(${this.watermarkRotation}deg)` });
              break;
            case 'bottom-left':
              Object.assign(style, { bottom: '10px', left: '10px', transformOrigin: '0 100%' });
              break;
            case 'bottom-center':
              Object.assign(style, { bottom: '10px', left: '50%', transform: `translateX(-50%) rotate(${this.watermarkRotation}deg)` });
              break;
            case 'bottom-right':
              Object.assign(style, { bottom: '10px', right: '10px', transformOrigin: '100% 100%' });
              break;
          }
          
          return style;
        }
      },
      methods: {
        handleCapture(imageData) {
          console.log('图片已捕获:', imageData);
        }
      }
    });
  </script>

  <style>
    /* 子组件样式 */
    .permission-msg {
      text-align: center;
      padding: 30px 20px;
      color: #666;
      background-color: #f9f9f9;
      border-radius: 15px;
      margin: 20px 0;
    }
    .camera-container {
      position: relative;
      width: 100%;
      height: 65vh;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      background-color: #000;
      margin-bottom: 25px;
    }
    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .watermark-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .capture-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #fff;
      border: 5px solid #2575fc;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }
    .capture-btn:active {
      transform: scale(0.95);
      border-color: #6a11cb;
    }
    .inner-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    }
    .action-buttons {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
      font-size: 16px;
    }
    .btn-save {
      background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
      color: white;
    }
    .btn-save:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }
    .btn-retake {
      background: linear-gradient(135deg, #f44336 0%, #c62828 100%);
      color: white;
    }
    .btn-retake:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }
    .preview-container {
      position: relative;
      width: 100%;
      height: 65vh;
      margin-bottom: 25px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    #previewImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-status {
      display: flex;
      align-items: center;
      color: #666;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-active {
      background-color: #4CAF50;
      box-shadow: 0 0 8px #4CAF50;
    }
    .status-inactive {
      background-color: #f44336;
    }
    .close-camera-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #ff9800;
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }
  </style>
</body>
</html>
